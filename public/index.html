<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas de Poker - Iniciar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center relative overflow-hidden">
    <div class="absolute -top-12 -right-12 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-20 h-20 rounded-3xl bg-amber-500/20 text-amber-400 mx-auto flex items-center justify-center text-4xl font-black mb-5 border border-amber-500/30 shadow-inner">
      ♠
    </div>

    <h1 class="text-3xl font-black text-white tracking-tight">Fichas de Poker</h1>
    <p class="text-slate-400 text-sm mt-2 mb-8">
      Baralho físico na mesa real, fichas e apostas sincronizadas no celular e na TV!
    </p>

    <div class="space-y-4">
      <!-- Opção 1: Abrir Tela da TV -->
      <a href="/tv.html" class="group block p-4 bg-slate-950 hover:bg-slate-800 border-2 border-amber-500/40 hover:border-amber-400 rounded-2xl text-left transition shadow-lg active:scale-98">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
            <i data-lucide="tv" class="w-6 h-6"></i>
          </div>
          <div class="flex-1">
            <h2 class="font-bold text-white text-base group-hover:text-amber-400 transition">Abrir Mesa na TV / PC</h2>
            <p class="text-xs text-slate-400 mt-0.5">Fica no meio da sala com o Pote e o feltro</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500 group-hover:text-amber-400 transition"></i>
        </div>
      </a>

      <!-- Opção 2: Entrar como Jogador -->
      <a href="/play.html" class="group block p-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-2xl text-left transition shadow active:scale-98">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-black">
            <i data-lucide="smartphone" class="w-6 h-6"></i>
          </div>
          <div class="flex-1">
            <h2 class="font-bold text-white text-base group-hover:text-emerald-400 transition">Entrar pelo Celular</h2>
            <p class="text-xs text-slate-400 mt-0.5">Controlar suas fichas e fazer suas apostas</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500 group-hover:text-emerald-400 transition"></i>
        </div>
      </a>
    </div>

    <!-- Info de Conexão na Rede -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-xs text-slate-400">
      <p class="flex items-center justify-center gap-1.5 font-medium">
        <i data-lucide="wifi" class="w-4 h-4 text-emerald-400"></i> Conecte todos os celulares no mesmo Wi-Fi
      </p>
      <div id="ipDisplay" class="font-mono text-amber-400 font-bold mt-1 text-sm">Carregando endereço...</div>
    </div>
  </div>

  <script>
    fetch('/api/info')
      .then(res => res.json())
      .then(data => {
        document.getElementById('ipDisplay').innerText = data.clientUrl.replace('http://', '').replace('/play.html?room=MESA-1', '');
      })
      .catch(() => {
        document.getElementById('ipDisplay').innerText = window.location.host;
      });

    lucide.createIcons();
  </script>
</body>
</html>
